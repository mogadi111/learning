<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Globe</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000010;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #globeViz {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #menu {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(15, 15, 30, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(8px);
  }
  #menu h1 {
    color: #fff;
    font-size: 15px;
    margin: 0 0 12px 0;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  #menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(255, 255, 255, 0.06);
    color: #e8e8ff;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #menu button:last-child { margin-bottom: 0; }
  #menu button:hover {
    background: rgba(80, 160, 255, 0.25);
    border-color: rgba(120, 180, 255, 0.6);
  }
  #menu button.active {
    background: rgba(80, 160, 255, 0.4);
    border-color: rgba(140, 200, 255, 0.9);
  }
  #info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 10;
    color: #cfd6ff;
    font-size: 13px;
    background: rgba(15, 15, 30, 0.65);
    border-radius: 8px;
    padding: 8px 12px;
    min-height: 18px;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Go to city</h1>
  <button data-city="Khartoum">Khartoum</button>
  <button data-city="Dubai">Dubai</button>
  <button data-city="London">London</button>
  <button data-city="Kuala Lumpur">Kuala Lumpur</button>
</div>

<div id="info"></div>
<div id="globeViz"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>
<script>
  const cities = [
    { name: "Khartoum",      lat: 15.5007,  lng: 32.5599 },
    { name: "Dubai",         lat: 25.2048,  lng: 55.2708 },
    { name: "London",        lat: 51.5074,  lng: -0.1278 },
    { name: "Kuala Lumpur",  lat: 3.1390,   lng: 101.6869 }
  ];

  const infoEl = document.getElementById('info');

  const world = Globe()
    (document.getElementById('globeViz'))
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundColor('#000010')
    .pointsData(cities)
    .pointLat('lat')
    .pointLng('lng')
    .pointColor(() => '#ff5050')
    .pointAltitude(0.01)
    .pointRadius(0.35)
    .pointLabel(d => d.name)
    .onPointClick(d => goToCity(d.name, true))
    .labelsData(cities)
    .labelLat('lat')
    .labelLng('lng')
    .labelText('name')
    .labelSize(1.1)
    .labelDotRadius(0.3)
    .labelColor(() => 'rgba(255,255,255,0.85)')
    .labelResolution(2)
    .onLabelClick(d => goToCity(d.name, true));

  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.4;

  function resize() {
    world.width(window.innerWidth).height(window.innerHeight);
  }
  window.addEventListener('resize', resize);
  resize();

  function setActiveButton(name) {
    document.querySelectorAll('#menu button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.city === name);
    });
  }

  function goToCity(name, fromGlobeClick) {
    const city = cities.find(c => c.name === name);
    if (!city) return;
    world.controls().autoRotate = false;
    world.pointOfView({ lat: city.lat, lng: city.lng, altitude: 1.6 }, 1200);
    setActiveButton(name);
    infoEl.textContent = `${city.name} — lat ${city.lat.toFixed(2)}, lng ${city.lng.toFixed(2)}`;
  }

  document.querySelectorAll('#menu button').forEach(btn => {
    btn.addEventListener('click', () => goToCity(btn.dataset.city));
  });
</script>

</body>
</html>
